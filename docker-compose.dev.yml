version: '3.8'

services:
  postgres:
    restart: unless-stopped
  
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    volumes:
      - .:/app
      - /app/node_modules
      - app-logs:/app/logs
    command: sh -c "npx prisma migrate deploy && npm run start:dev"
    environment:
      NODE_ENV: development
