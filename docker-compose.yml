version: '3.8'

services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    image: dololob92/postgres:latest
    container_name: home-library-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-home_library}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-logs:/var/log/postgresql
    networks:
      - app-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: dololob92/home-library-app:latest
    container_name: home-library-app
    restart: unless-stopped
    ports:
      - '${PORT:-4000}:4000'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-home_library}
      PORT: ${PORT:-4000}
      CRYPT_SALT: ${CRYPT_SALT:-10}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_SECRET_REFRESH_KEY: ${JWT_SECRET_REFRESH_KEY}
      TOKEN_EXPIRE_TIME: ${TOKEN_EXPIRE_TIME:-1h}
      TOKEN_REFRESH_EXPIRE_TIME: ${TOKEN_REFRESH_EXPIRE_TIME:-24h}
    volumes:
      - app-logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    command: sh -c "DATABASE_URL=$DATABASE_URL npx prisma migrate deploy && npm run start:prod"

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
  postgres-logs:
  app-logs:
