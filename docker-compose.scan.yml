version: '3.8'

services:
  trivy-scan:
    image: aquasec/trivy:latest
    container_name: trivy-scanner
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - trivy-cache:/root/.cache/trivy
    command: >
      image
      --severity CRITICAL,HIGH,MEDIUM
      --exit-code 1
      --format table
      --output /dev/stdout
      home-library-app:latest
    depends_on:
      - trivy-db-update

  trivy-db-update:
    image: aquasec/trivy:latest
    container_name: trivy-db-updater
    volumes:
      - trivy-cache:/root/.cache/trivy
    command: image --download-db-only

volumes:
  trivy-cache:
